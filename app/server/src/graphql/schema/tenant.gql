type Tenant {
  id: ID!
  name: String!
}

input CreateTenantInput {
  name: String!
}

extend type Query {
  tenants: [Tenant!]!
}

extend type Mutation {
  createTenant(input: CreateTenantInput!): Tenant!
  deleteTenant(tenantId: ID!): Boolean!
  selectTenant(tenantId: ID!, expectedVersion: Int!): User!
}
