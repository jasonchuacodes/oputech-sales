enum TenantType {
  DEFAULT
  PHOTO
}

type Tenant {
  id: ID!
  name: String!
  type: TenantType!
}

input CreateTenantInput {
  name: String!
  type: TenantType!
}

input UpdateTenantInput {
  name: String!
  type: TenantType!
}

extend type Query {
  tenants: [Tenant!]!
}

extend type Mutation {
  createTenant(input: CreateTenantInput!): Tenant!
  updateTenant(tenantId: ID!, input: UpdateTenantInput!): Tenant!
  deleteTenant(tenantId: ID!): Boolean!
  selectTenant(tenantId: ID!, expectedVersion: Int!): User!
}
