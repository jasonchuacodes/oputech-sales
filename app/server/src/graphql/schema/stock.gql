scalar Decimal

enum StockUnit {
  KG
  G
  L
  ML
  PC
  GAL
  BAG
}

enum StockMovementReason {
  OPENING
  RECEIPT
  SALE
  VOID
  CORRECTION
}

enum StockMovementSourceType {
  TRANSACTION
  STOCK_OPERATION
}

type StockMovement {
  id: ID!
  productId: ID!
  product: Product
  productName: String!
  unit: StockUnit!
  delta: Decimal!
  balanceBefore: Decimal!
  balanceAfter: Decimal!
  reason: StockMovementReason!
  sourceType: StockMovementSourceType!
  sourceId: ID!
  actorId: ID
  occurredAt: String!
  postedAt: String!
  note: String
  packageLabel: String
  packageCount: Decimal
  quantityPerPackage: Decimal
}

input StockPaginationInput {
  page: Int = 1
  pageSize: Int = 25
}

input StockMovementFilterInput {
  productId: ID
  reason: StockMovementReason
  sourceType: StockMovementSourceType
}

type StockMovementPage {
  items: [StockMovement!]!
  page: Int!
  pageSize: Int!
  totalCount: Int!
  totalPages: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

input EnableStockTrackingInput {
  clientMutationId: ID!
  productId: ID!
  unit: StockUnit!
  openingQuantity: Decimal!
  occurredAt: String
  note: String
}

input ReceiveStockInput {
  clientMutationId: ID!
  productId: ID!
  packageCount: Decimal!
  quantityPerPackage: Decimal!
  packageLabel: String
  occurredAt: String
  note: String
}

input ReconcileStockInput {
  clientMutationId: ID!
  productId: ID!
  countedQuantity: Decimal!
  expectedRevision: Int!
  occurredAt: String
  note: String!
}

extend type Query {
  stockMovements(
    filter: StockMovementFilterInput
    pagination: StockPaginationInput
  ): StockMovementPage!
}

extend type Mutation {
  enableStockTracking(input: EnableStockTrackingInput!): Product!
  receiveStock(input: ReceiveStockInput!): Product!
  reconcileStock(input: ReconcileStockInput!): Product!
}
