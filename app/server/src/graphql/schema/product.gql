type Product {
  id: ID!
  tenantId: ID!
  name: String!
  price: Float!
  imageUrl: String
  printCount: Int
  stockTrackingEnabled: Boolean!
}

input ProductPaginationInput {
  page: Int = 1
  pageSize: Int = 50
}

type ProductPage {
  items: [Product!]!
  page: Int!
  pageSize: Int!
  totalCount: Int!
  totalPages: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

extend type Query {
  products(pagination: ProductPaginationInput): ProductPage!
  productsByName(search: String!, pagination: ProductPaginationInput): ProductPage!
}

input CreateProductInput {
  name: String!
  price: Float!
  imageUrl: String
  printCount: Int
}

input UpdateProductInput {
  name: String
  price: Float
  imageUrl: String
  printCount: Int
}

extend type Mutation {
  createProduct(input: CreateProductInput!): Product!
  updateProduct(id: ID!, input: UpdateProductInput!): Product!
  deleteProduct(id: ID!): Boolean!
}
