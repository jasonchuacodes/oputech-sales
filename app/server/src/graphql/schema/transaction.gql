enum PaymentType {
  CASH
  ONLINE
}

enum TransactionType {
  SALE
  EXPENSE
}

enum TransactionStatus {
  ACTIVE
  VOIDED
}

type TransactionItem {
  productId: ID!
  name: String!
  price: Float!
  printCount: Int!
  quantity: Int!
  inventoryQuantity: Decimal
  inventoryUnit: String
}

type Transaction {
  id: ID!
  tenantId: ID!
  clientMutationId: ID
  type: TransactionType!
  items: [TransactionItem!]!
  label: String
  paymentType: PaymentType!
  total: Float!
  processed: Boolean!
  status: TransactionStatus!
  inventoryAppliedAt: String
  occurredAt: String!
  createdAt: String!
}

input TransactionItemInput {
  productId: ID!
  quantity: Int!
}

input CreateTransactionInput {
  type: TransactionType!
  items: [TransactionItemInput!]
  label: String
  amount: Float
  paymentType: PaymentType!
  clientMutationId: ID
  occurredAt: String
}

input TransactionFilter {
  from: String
  to: String
  processed: Boolean
}

extend type Query {
  transactions(filter: TransactionFilter): [Transaction!]!
}

extend type Mutation {
  createTransaction(input: CreateTransactionInput!): Transaction!
}

extend type Mutation {
  deleteTransaction(id: ID!): Boolean!
  voidTransaction(id: ID!): Transaction
}
