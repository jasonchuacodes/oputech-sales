enum UserRole {
  SUPERADMIN
  ADMIN
  STAFF
}

type User {
  id: ID!
  username: String!
  fullName: String
  email: String
  role: UserRole!
  tenantIds: [ID!]!
  currentTenantId: ID
  tenantSelectionVersion: Int!
}

extend type Query {
  users: [User!]!
}

input CreateUserInput {
  username: String!
  fullName: String
  email: String
  password: String!
  role: UserRole!
  tenantIds: [ID!]!
}

input UpdateUserInput {
  username: String
  fullName: String
  email: String
  role: UserRole
  tenantIds: [ID!]
}

extend type Mutation {
  createUser(input: CreateUserInput!): User!
  updateUser(id: ID!, input: UpdateUserInput!): User!
  deleteUser(id: ID!): Boolean!
  resetPassword(id: ID!, password: String!): User!
}
